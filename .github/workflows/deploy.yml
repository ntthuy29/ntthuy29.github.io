name: CI/CD Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Login DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: 🏗️ Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/projsgroup:latest .

      - name: 📤 Push image lên DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/projsgroup:latest

      - name: 🖥️ SSH vào VPS và deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/projsgroup:latest
            docker stop projsgroup || true
            docker rm projsgroup || true
            docker run -d --name projsgroup -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/projsgroup:latest
