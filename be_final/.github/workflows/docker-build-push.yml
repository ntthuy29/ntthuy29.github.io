name: Build and Push Docker Image

on:
  push:
    branches: ["main"] # Kích hoạt workflow khi push lên branch "main"
  pull_request:
    branches: ["main"]

jobs:
  docker_build_and_push: 
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Checkout code từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Login vào Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Bước 4: Build và push image lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/your-image-name:latest

      # Các bước "Post..." sẽ tự động hiển thị khi job hoàn thành
